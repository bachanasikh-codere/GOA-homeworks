<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1 -->
    <h2>1. მთავარი ღერძის ცენტრი</h2>
    <div class="parent parent1">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
    </div>

    <!-- 2 -->
    <h2>2. მაქსიმალური დაშორება</h2>
    <div class="parent parent2">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
    </div>

    <!-- 3 -->
    <h2>3. თანაბარი დაშორება + მეორე ღერძის ცენტრი</h2>
    <div class="parent parent3">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
    </div>

    <!-- 4 -->
    <h2>4. მთავარი ღერძის ბოლო + მეორე ღერძის დასაწყისი</h2>
    <div class="parent parent4">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
    </div>

    <!-- 5 -->
    <h2>5. თანაბარი დაშორება + მეორე ღერძის ბოლო</h2>
    <div class="parent parent5">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
    </div>

</body>
</html>
