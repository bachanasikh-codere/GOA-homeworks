
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">
        <div class="product-image">
            <img src="perfume.jpg" alt="Gabrielle Chanel Perfume">
        </div>

        <div class="product-info">
            <span class="category">PERFUME</span>

            <h1>Gabrielle Essence Eau De Parfum</h1>

            <p class="description">
                A floral, solar and voluptuous interpretation
                composed by Olivier Polge, Perfumer-Creator
                for the House of CHANEL.
            </p>

            <div class="price">
                <span class="new-price">$149.99</span>
                <span class="old-price">$169.99</span>
            </div>

            <button class="cart-button">
                🛒 Add to Cart
            </button>
        </div>
    </div>

</body>
</html>
