<!-- PADDING — 5 დავალება

1. შექმენი div, რომელსაც ექნება 50px padding ზემოდან და ქვემოდან, ხოლო 20px მარცხნიდან და მარჯვნიდან.

2. შექმენი button და გამოიყენე padding ისე, რომ ღილაკი ტექსტის გარშემო უფრო დიდი გახდეს.

3. შექმენი div, რომელშიც იქნება h2 და p. გამოიყენე padding ისე, რომ ტექსტი div-ის კიდეებს არ მიეკროს.

4. შექმენი 3 სხვადასხვა div და თითოეულს მიეცი განსხვავებული padding.

5. შექმენი პატარა card, რომელსაც ექნება background-color, border და 30px padding. შიგნით ჩასვი სათაური და ტექსტი.


MARGIN — 5 დავალება

1. შექმენი ორი div და გამოიყენე margin, რომ მათ შორის 30px დაშორება იყოს.

2. შექმენი h1 და p. გამოიყენე margin ისე, რომ h1-სა და p-ს შორის 20px დაშორება იყოს.

3. შექმენი div და გამოიყენე margin-top, რომ ის გვერდის ზემოდან 50px-ით დაშორდეს.

4. შექმენი სამი button და გამოიყენე margin-left, რომ ისინი ერთმანეთისგან ჰორიზონტალურად დაშორდნენ.

5. შექმენი card და გამოიყენე margin: 20px auto, რათა card ჰორიზონტალურად ცენტრში მოათავსო. -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding and Margin</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PADDING 1 -->
    <h2>Padding 1</h2>
    <div class="padding1">
    </div>

    <!-- PADDING 2 -->
    <h2>Padding 2</h2>
    <button class="padding-button">Click Me</button>

    <!-- PADDING 3 -->
    <h2>Padding 3</h2>
    <div class="padding3">
        <h2>სათაური</h2>
        <p>ეს </p>
    </div>

    <!-- PADDING 4 -->
    <h2>Padding 4</h2>
    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
    <div class="box3">Box 3</div>

    <!-- PADDING 5 -->
    <h2>Padding 5</h2>
    <div class="card">
        <h2>My Card</h2>
        <p>თ.</p>
    </div>

    <!-- MARGIN 1 -->
    <h2>Margin 1</h2>
    <div class="margin-box">პირველი</div>
    <div class="margin-box">მეორე </div>

    <!-- MARGIN 2 -->
    <h2>Margin 2</h2>
    <h1 class="margin-title">Hello World</h1>
    <p>ე.</p>

    <!-- MARGIN 3 -->
    <h2>Margin 3</h2>
    <div class="margin-top">
        
    </div>

    <!-- MARGIN 4 -->
    <h2>Margin 4</h2>
    <button class="margin-button">Button 1</button>
    <button class="margin-button">Button 2</button>
    <button class="margin-button">Button 3</button>

    <!-- MARGIN 5 -->
    <h2>Margin 5</h2>
    <div class="center-card">
        <h2>Centered Card</h2>
        <p>რშია.</p>
    </div>

</body>
</html>
