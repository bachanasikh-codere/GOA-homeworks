<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <img class="cover" src="illustration-article.svg" alt="HTML and CSS illustration">

        <div class="content">
            <span class="tag">Learning</span>

            <p class="date">Published 21 Dec 2023</p>

            <h1>HTML & CSS foundations</h1>

            <p class="description">
                These languages are the backbone of every website,
                defining structure, content, and presentation.
            </p>

            <div class="author">
                <img src="image-avatar.webp" alt="Greg Hooper">
                <span>Greg Hooper</span>
            </div>
        </div>
    </main>

</body>
</html>
